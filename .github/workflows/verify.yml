name: Vérifications
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Manifests valides, code commun à jour, pas de ressource distante
        run: python3 tools/verify.py
      - name: Paquets ZIP et empreintes SHA-256
        run: python3 tools/package.py
