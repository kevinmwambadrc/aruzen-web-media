<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Music Grab</title><link rel="stylesheet" href="shared/ui.css"></head>
<body style="--accent:#7c3aed">
  <header><img src="icons/32.png" alt=""><h1>Music Grab</h1><span class="grow"></span><button id="folder" class="mini">Dossier</button></header>
  <main>
    <div id="info" class="card"><div class="mut">Analyse de la page…</div></div>
    <div class="row">
      <label>Format
        <select id="fmt">
          <option value="mp3">MP3 (universel)</option>
          <option value="m4a">M4A (sans réencodage, plus rapide)</option>
          <option value="opus">Opus</option>
          <option value="flac">FLAC</option>
          <option value="wav">WAV</option>
        </select>
      </label>
    </div>
    <div class="row"><input id="url" type="text" class="grow" placeholder="Ou colle un lien…"><button id="go" class="primary">Extraire</button></div>
    <h2>Téléchargements</h2>
    <div id="jobs" class="jobs"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
