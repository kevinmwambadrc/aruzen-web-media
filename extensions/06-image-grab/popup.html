<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Image Grab</title><link rel="stylesheet" href="shared/ui.css"></head>
<body style="--accent:#16a34a">
  <header><img src="icons/32.png" alt=""><h1>Image Grab</h1><span class="grow"></span><span id="count" class="mut"></span></header>
  <main>
    <div class="row">
      <label>Taille min.
        <select id="min"><option value="0">Toutes</option><option value="100" selected>100 px</option><option value="300">300 px</option><option value="800">800 px</option></select>
      </label>
      <label><input type="checkbox" id="all"> Tout cocher</label>
    </div>
    <div id="types" class="chips"></div>
    <div id="grid" class="grid"></div>
    <div class="row">
      <label>Enregistrer en <select id="fmt"></select></label>
      <label id="qWrap">Qualité <select id="q"><option value="0.95">Haute</option><option value="0.85">Moyenne</option><option value="0.7">Légère</option></select></label>
      <button id="copy" class="mini" title="Copier les liens cochés">⧉ Liens</button>
    </div>
    <button id="dl" class="primary">Télécharger la sélection</button>
    <div id="msg" class="mut small"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
