<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Playlist Grab</title><link rel="stylesheet" href="shared/ui.css"></head>
<body style="--accent:#0ea5e9">
  <header><img src="icons/32.png" alt=""><h1>Playlist Grab</h1><span class="grow"></span><button id="folder" class="mini">Dossier</button></header>
  <main>
    <div class="row"><input id="url" type="text" class="grow" placeholder="Lien d'une playlist, d'un album ou d'une chaîne"><button id="scan">Analyser</button></div>
    <div id="info" class="card"><div class="mut">Analyse de la page…</div></div>
    <div class="row"><label><input type="checkbox" id="all"> Tout cocher</label><span class="grow"></span><span id="sel" class="mut small"></span></div>
    <div id="entries" class="list"></div>
    <h2>Format</h2>
    <div id="formats"></div>
    <div class="row">
      <label id="qWrap">Qualité <select id="quality"><option value="best">Meilleure</option><option value="2160">4K</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></label>
      <label id="aqWrap">Débit <select id="aq"></select></label>
    </div>
    <div class="row"><label class="grow">Éléments <input id="items" type="text" class="grow" placeholder="tous, ou ex. 1-10,15 (ou coche la liste)"></label><button id="go" class="primary">Télécharger</button></div>
    <div id="msg" class="small"></div>
    <h2>Téléchargements</h2>
    <div id="jobs" class="jobs"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
