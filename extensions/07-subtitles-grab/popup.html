<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Sous-titres &amp; Miniatures</title><link rel="stylesheet" href="shared/ui.css"></head>
<body style="--accent:#0d9488">
  <header><img src="icons/32.png" alt=""><h1>Sous-titres &amp; Miniatures</h1><span class="grow"></span><button id="folder" class="mini">Dossier</button></header>
  <main>
    <div id="info" class="card"><div class="mut">Analyse de la page…</div></div>
    <h2>Sous-titres disponibles</h2>
    <div id="langs" class="chips"><span class="mut">…</span></div>
    <div class="row">
      <label>Format <select id="sfmt">
        <option value="srt">SRT (lecteurs, montage)</option><option value="vtt">VTT (web)</option>
        <option value="ass">ASS (stylés)</option><option value="lrc">LRC (paroles)</option><option value="txt">TXT (transcription)</option>
      </select></label>
      <button id="subs" class="primary grow">Télécharger</button>
    </div>
    <div class="row">
      <label>Miniature en <select id="tfmt"><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option></select></label>
      <button id="thumb" class="grow">Miniature HD</button>
    </div>
    <h2>Téléchargements</h2>
    <div id="jobs" class="jobs"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
