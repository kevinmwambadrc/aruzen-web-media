<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><title>Social</title>
  <link rel="stylesheet" href="shared/ui.css"><link rel="stylesheet" href="popup.css">
</head>
<body style="--accent:#2ba84a">
  <header><img src="icons/32.png" alt=""><h1>Social</h1><span class="grow"></span><button id="studio" class="mini">Studio d'aperçu ↗</button><button id="settings" class="mini" title="Réglages : marques, réseaux, légendes">⚙</button></header>
  <nav class="tabs">
    <button data-tab="legendes" class="on">Légendes</button>
    <button data-tab="utm">Liens UTM</button>
  </nav>

  <main id="legendes" class="pane">
    <div class="row"><label class="grow">Marque <select id="brand" class="grow"></select></label></div>
    <div id="snips" class="list"></div>
    <div class="mut small">« Insérer » écrit au curseur dans le champ de publication ouvert (LinkedIn, Facebook…). Plus simple encore : clic droit dans le champ › Insérer (Aruzen Social). Marques, réseaux et légendes se modifient dans ⚙ Réglages.</div>
  </main>

  <main id="utm" class="pane" hidden>
    <input id="uUrl" type="text" placeholder="https://…">
    <div class="chips" id="uNet"></div>
    <div class="row">
      <input id="uCamp" type="text" class="grow" list="camps" placeholder="Campagne (ex. focus 5C+P)"><datalist id="camps"></datalist>
      <input id="uContent" type="text" class="grow" placeholder="Variante (facultatif)">
    </div>
    <div class="card"><div id="uOut" class="out mut">Le lien apparaît ici</div></div>
    <div class="row"><button id="uCopy" class="primary grow">Copier le lien</button></div>
    <h2>Récents</h2>
    <div id="uHist" class="list"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
